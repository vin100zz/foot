<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply theme before first paint to avoid flash
    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
  </script>
</head>
<body>
  <button id="theme-toggle" title="Changer le thème">☀</button>
  <div id="app-root">
    <div style="padding:20px;color:#a0a0c0;text-align:center">Chargement...</div>
  </div>
  <script src="js/teams-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/competition.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const btn = document.getElementById('theme-toggle');
      function syncBtn() {
        btn.textContent = document.documentElement.classList.contains('light') ? '🌙' : '☀';
      }
      syncBtn();
      btn.addEventListener('click', function () {
        document.documentElement.classList.toggle('light');
        const isLight = document.documentElement.classList.contains('light');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        syncBtn();
      });
    })();
  </script>
</body>
</html>
